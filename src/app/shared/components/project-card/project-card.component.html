<div class="bg-card-border rounded-lg overflow-hidden hover:transform hover:scale-105 transition-all duration-300 border border-card-border hover:border-accent">
  <img 
    [src]="project.image" 
    [alt]="project.title"
    class="w-full h-48 object-cover"
    loading="lazy">
  
  <div class="p-6">
    <h3 class="text-xl font-bold text-light-text mb-3">{{ project.title }}</h3>
    <p class="text-secondary-text mb-4 leading-relaxed">{{ project.description }}</p>
    
    <div class="flex flex-wrap gap-2 mb-4">
      @for (tech of project.technologies; track tech) {
        <span class="px-3 py-1 bg-accent/20 text-accent rounded-full text-sm">
          {{ tech }}
        </span>
      }
    </div>
    
    <a 
      [href]="project.link" 
      target="_blank"
      rel="noopener noreferrer"
      class="inline-flex items-center text-accent hover:text-accent/80 font-semibold transition-colors">
      Ver Projeto
      <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
      </svg>
    </a>
  </div>
</div>
